<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

</head>
<body style="background-color: #fff;font-size: 14px;line-height: 1.428;">

    <style type="text/css">  
        .comments {  
         width:95%;/*自动适应父布局宽度*/  
         overflow:auto;  
         word-break:break-all;  
        /*在ie中解决断行问题(防止自动变为在一行显示，主要解决ie兼容问题，ie8中当设宽度为100%时，文本域类容超过一行时，  
        当我们双击文本内容就会自动变为一行显示，所以只能用ie的专有断行属性“word-break或word-wrap”控制其断行)*/  
        }  
    </style>

<form role="form">
    <div class="comments">
        <textarea class="comments" id="inputData" rows="10" auto-height="true" ></textarea>
        <span class="comments">
            <button id="analysisMsgBtn" type="button" class="comments" style="width: 95%; height: 50px;">解析</button>
        </span>
    </div>

    <div id="graph"></div>

<script type="text/javascript">

const button = document.getElementById('analysisMsgBtn');

    // 添加点击事件监听器
    button.addEventListener('click', function() {

        const dotSource = ` digraph G { A -> B;  B -> C;   C -> A;  }  `;
        var dott;

        var inputpgn = document.getElementById("inputData").value;

        moves2list(inputpgn);
        dott = moves2graph(double_steps);

        Viz.instance().then(function(viz) {
            var svg = viz.renderSVGElement(dott);
            document.getElementById("graph").appendChild(svg);
        });

    });


</script>
</form>
</body>
</html>
