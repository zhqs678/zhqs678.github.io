<script type="text/javascript">

	function getRadioVal(radioName) {
		var rads = document.getElementsByName(radioName);
		for(var rad in rads) {
			if(rads[rad].checked)
				return rads[rad].value;
		}
		return null;
	}
	//清空

		// \n08 4e 36 43 44 4c 33 37 \

		// \n01 05 1e 00 00 00 00 a0 \
		// \n02 0f 00 00 00 00 00 00 \
		// \n03 00 32 90 01 00 00 a0 \

		//var msg = document.getElementById("inputData").value = "00 00 00 00 00 20 00 00";

		//
        var msg = document.getElementById("inputData").value;

        var msgType = getRadioVal("analysisMsg");

        //首先去掉报文中的空格
        msg = msg.replace(/\s*/g,"");
        var data = "";

        if (msgType == "02") {	//02__充电启动应答帧

            //data = read_msg_data(msg);
			data = msg;

            var cell = data.substr(0, 2);
            resultMsg += "充电接口标识: " + cell + "\n";
            cell = data.substr(2, 2);
            resultMsg += "负荷控制开关: " + cell + " (01-启用，02-关闭)\n";
            cell = data.substr(4, 2);
            resultMsg += "确认标识: " + cell + " (00-成功，01-失败)" + "\n";
			
			resultMsg += "V1.14版本无失败原因.\n";
            cell = data.substr(6, 2);
            resultMsg += "失败原因: " + analysis_02(cell) + "\n";
			cell = data.substr(8, 2);
            resultMsg += "即插即充标识: " + cell + " (01-非即插即充,02-即插即充)" + "\n";

        } else if (msgType == "11") {   //充电启动完成
			data = read_msg_data(msg);
            resultMsg += analysis_11(data);
        } else if (msgType == "13") {     //充电停止完成
			data = read_msg_data(msg);
            resultMsg += analysis_13(data);
        } else if (msgType == "20") {     //遥测帧
			data = read_msg_data(msg);
			resultMsg += analysis_20(data);
		} else if (msgType == "22") {     //遥信帧1
			data = msg;
			resultMsg += analysis_22(data);
		} else if (msgType == "23") {     //遥信帧2
			data = msg;
			resultMsg += analysis_23(data);
		} else if (msgType == "24") {     //bms数据
			data = msg;
			resultMsg += analysis_24(data);
		} else if (msgType == "26") {     //充电模块数据
			data = msg;
			resultMsg += analysis_26(data);
		} else if (msgType == "2a") {     //充电模块遥信数据1
			data = msg;
			resultMsg += analysis_2a(data);
		} else if (msgType == "2b") {     //液冷数据
			data = msg;
			resultMsg += analysis_2b(data);
		}
		
		
        document.getElementById("analysisResult").value = resultMsg;
    }

			let activeModules = parseInt(msg.substr(6, 2), 16);
			result += `在用充电模块总数: ${activeModules} 台\n`;

			// 5. 故障充电模块总数 (1 Byte)
			let faultModules = parseInt(msg.substr(8, 2), 16);
			result += `故障充电模块总数: ${faultModules} 台\n`;
			result += `  注: 包含被锁定故障不再投入使用的模块\n`;

			// 6. 当前充电端口在用充电模块总数 (1 Byte)
			let portActiveModules = parseInt(msg.substr(10, 2), 16);
			result += `当前充电端口在用充电模块总数: ${portActiveModules} 台\n`;

			// 7. 备用 (2 Bytes)
			let reserved = msg.substr(12, 4);
			result += `备用字段: 0x${reserved}\n`;

			return result;
		}

	function analysis_2a(msg) {
		// 需要至少 Data2 ~ Data6，共 5 个字节 = 10 个十六进制字符
		if (msg.length < 10) {
			return "数据长度不足，至少需要 5 字节";
		}

		let result = "";

		// Data2 (msg 索引 0~1)
		let data2 = parseInt(msg.substr(0, 2), 16);
		// Data3 (msg 索引 2~3)
		let data3 = parseInt(msg.substr(2, 2), 16);
		// Data4 (msg 索引 4~5)
		let data4 = parseInt(msg.substr(4, 2), 16);
		// Data5 (msg 索引 6~7)
		let data5 = parseInt(msg.substr(6, 2), 16);
		// Data6 (msg 索引 8~9)
		let data6 = parseInt(msg.substr(8, 2), 16);

		// ---------------- Data2 解析 ----------------
		// bit1 (0x01)
		if (data2 & 0x01) result += "开关模块拒动/误动故障\n";
		// bit2 (0x02)
		if (data2 & 0x02) result += "开关模块粘连故障\n";
		// bit3 预留，不处理
		// bit4 预留，不处理
		// bit5 (0x10)
		if (data2 & 0x10) result += "充电模块输入不平衡告警\n";
		// bit6 (0x20)
		if (data2 & 0x20) result += "充电模块 PFC 电路过温故障\n";
		// bit7 (0x40)
		if (data2 & 0x40) result += "充电模块主变压器过温故障\n";
		// bit8 (0x80)
		if (data2 & 0x80) result += "充电模块 DC/DC 电路过温故障\n";

		// ---------------- Data3 解析 ----------------
		// bit1 (0x01)
		if (data3 & 0x01) result += "充电模块输出隔离二极管故障\n";
		// bit2 (0x02)

		function analysis_24(msg) {
				// 输入：hex字符串，从充电接口标识开始
				if (msg.length < 12) {
					return "数据长度不足，至少需要6字节";
				}

				let result = "";
				let offset = 0;

				// 1. 充电接口标识
				let interfaceId = parseInt(msg.substr(offset, 2), 16);
				result += `充电接口标识: ${interfaceId}\n`;
				offset += 2;

				// 2. PGN (3字节，小端模式：低字节在前)
				let pgnLow = parseInt(msg.substr(offset, 2), 16);
				let pgnMid = parseInt(msg.substr(offset + 2, 2), 16);
				let pgnHigh = parseInt(msg.substr(offset + 4, 2), 16);
				let pgn = (pgnHigh << 16) | (pgnMid << 8) | pgnLow;
				let pgnHex = pgn.toString(16).toUpperCase().padStart(6, '0');
				result += `PGN: 0x${pgnHex} (${pgn})\n`;
				offset += 6;

				// 3. 优先权
				let priority = parseInt(msg.substr(offset, 2), 16);
				result += `优先权: ${priority}\n`;
				offset += 2;

				// 4. 数据长度
				let dataLen = parseInt(msg.substr(offset, 2), 16);
				result += `数据长度: ${dataLen} 字节\n`;
				offset += 2;

				// 5. 数据内容
				if (msg.length >= offset + dataLen * 2) {
					let dataHex = msg.substr(offset, dataLen * 2);
					result += `数据内容: ${dataHex}\n`;
					result += parseDataByPGN(pgnMid, dataHex);
				}

				return result;
			}

			function parseDataByPGN(pgnMid, dataHex) {
				let result = "";
				let data = [];
				for (let i = 0; i < dataHex.length; i += 2) {
					data.push(parseInt(dataHex.substr(i, 2), 16));
				}

				switch (pgnMid) {
					case 256:  // CRM
						result += "--- 充电机辨识报文(CRM) ---\n";
						result += `辨识结果: ${data[0] === 0xAA ? "成功" : "失败"}\n`;
						if (data[1]) result += `充电机编号: ${data[1]}\n`;
						break;

					case 512:  // BRM
						result += "--- BMS辨识报文(BRM) ---\n";
						let version = (data[2] << 16) | (data[1] << 8) | data[0];
						result += `协议版本: ${(version >> 16) & 0xFF}.${(version >> 8) & 0xFF}.${version & 0xFF}\n`;
						let battType = ["", "铅酸", "镍氢", "磷酸铁锂", "锰酸锂", "钴酸", "三元材料", "聚合物锂离子", "钛酸锂"][data[3]];
						result += `电池类型: ${battType || "其他"}\n`;
						let capacity = (data[5] << 8) | data[4];
						result += `额定容量: ${capacity * 0.1} Ah\n`;
						let voltage = (data[7] << 8) | data[6];
						result += `额定总电压: ${voltage * 0.1} V\n`;
						break;

					case 0x06: // BCP
						result += "--- 车辆充电参数报文(BCP) ---\n";
						let maxCellVoltage = (data[1] << 8) | data[0];
						result += `单体最高允许充电电压: ${maxCellVoltage * 0.01} V\n`;
						let maxCurrent = ((data[3] << 8) | data[2]) - 400;
						result += `最高允许充电电流: ${maxCurrent * 0.1} A\n`;
						break;

					case 0x10: // BCL
						result += "--- 电池充电需求报文(BCL) ---\n";
						let reqVoltage = (data[1] << 8) | data[0];
						let reqCurrent = ((data[3] << 8) | data[2]) - 400;
						let mode = data[4] === 0x01 ? "恒压" : (data[4] === 0x02 ? "恒流" : "未知");
						result += `充电电压需求: ${reqVoltage * 0.1} V\n`;
						result += `充电电流需求: ${reqCurrent * 0.1} A\n`;
						result += `充电模式: ${mode}\n`;
						break;

					case 0x12: // CCS
						result += "--- 充电机充电状态报文(CCS) ---\n";
						let outVoltage = (data[1] << 8) | data[0];
						let outCurrent = ((data[3] << 8) | data[2]) - 400;
						result += `输出电压: ${outVoltage * 0.1} V\n`;
						result += `输出电流: ${outCurrent * 0.1} A\n`;
						break;

					case 0x19: // BST
						result += "--- 车辆中止充电报文(BST) ---\n";
						result += `中止原因码: 0x${data[0].toString(16)}\n`;
						break;

					case 0x1A: // CST
						result += "--- 充电机中止充电报文(CST) ---\n";
						result += `中止原因码: 0x${data[0].toString(16)}\n`;
						break;

					default:
						result += `(未识别的PGN: 0x${pgn.toString(16)})\n`;
				}
				return result;
			}

    
	//自定义函数（用于将sessionId由16进制转换为10进制）
    function bigMut(big, common) {
		    big += "";
		    common += "";
		    if (big.length < common.length) {
		        big = [common, common = big][0];
		    }
		    big = big.split("").reverse();
		    var oneMutManyRes = [];
		    var i = 0,
		        len = big.length;
		    for (; i < len; i++) {
		        oneMutManyRes[oneMutManyRes.length] = oneMutMany(big[i], common) + getLenZero(i);
		    }
		    var result = oneMutManyRes[0];
		    for (i = 1, len = oneMutManyRes.length; i < len; i++) {
		        result = bigNumAdd(result, oneMutManyRes[i]);
		    }
		    return result;
		}

		function getLenZero(len) {
		    len += 1;
		    var ary = [];
		    ary.length = len;
		    return ary.join("0");
		}

		function oneMutMany(one, many) {
		    one += "";
		    many += "";
		    if (one.length != 1) {
		        one = [many, many = one][0];
		    }
		    one = parseInt(one, 10);
		    var i = 0,
		        len = many.length,
		        resAry = [],
		        addTo = 0,
		        curItem,
		        curRes,
		        toSave;
		    many = many.split("").reverse();
		    for (; i <= len; i++) {
		        curItem = parseInt(many[i] || 0, 10);
		        curRes = curItem * one + addTo;
		        toSave = curRes % 10;
		        addTo = (curRes - curRes % 10) / 10;
		        resAry.unshift(toSave);
		    }
		    if (resAry[0] == 0) {
		        resAry.splice(0, 1);
		    }
		    return resAry.join("");
		}

		function bigNumAdd(big, common) {
		    big += "";
		    common += "";
		    var maxLen = Math.max(big.length, common.length),
		        bAry = big.split("").reverse(),
		        cAry = common.split("").reverse(),
		        i = 0,
		        addToNext = 0,
		        resAry = [],
		        fn,
		        sn,
		        sum;
		    for (; i <= maxLen; i++) {
		        fn = parseInt(bAry[i] || 0);
		        sn = parseInt(cAry[i] || 0);
		        sum = fn + sn + addToNext;
		        addToNext = (sum - sum % 10) / 10;
		        resAry.unshift(sum % 10);
		    }
		    if (resAry[0] == 0) {
		        resAry.splice(0, 1);
		    }
		    return resAry.join("");
		}

		function sumStrings(a, b) {
		    var res = '',
		        c = 0;
		    a = a.split('');
		    b = b.split('');
		    while (a.length || b.length || c) {
		        c += ~~a.pop() + ~~b.pop();
		        res = c % 10 + res;
		        c = c > 9;
		    }
		    return res.replace(/^0+/, '');
		}

    function hexToAscii(pileCode){
        var len = pileCode.length;

        for (var i = 0; i < len; i = i + 2) {
            asciiPileCode = parseInt(pileCode.substr(i, 2), 16);

    //切换高低位字符顺序
    function exchangeHL(hexStr){
        var resultStr  ='';
        var hexStrLen = hexStr.length/2;
        for(var i=0; i<hexStrLen;i++ ){
            resultStr = hexStr.substr(i*2,2)+resultStr;
        }
        return resultStr;

    //解析小时分钟
    function analysistime(timeStr) {
        var resultTime = "";
        resultTime = parseInt(timeStr.substr(0, 2), 16) + ":" + parseInt(timeStr.substr(2, 2), 16);
        return resultTime;
    }
    //解析时间
    function analysisDate(dateStr){
        var resultDate = "";
        var dateStrLen = dateStr.length/2;
        for(var i=0;i<dateStrLen;i++){
            if(i==2||i==3){
                resultDate = resultDate+"-" + parseInt(dateStr.substr(i*2,2),16);
                continue;
            }else if(i==5||i==6||i==7){
                resultDate = resultDate+":" + parseInt(dateStr.substr(i*2,2),16);
                continue;
            }else if(i==4){
                resultDate = resultDate+" "+ parseInt(dateStr.substr(i*2,2),16);
                continue;
            }
            resultDate += parseInt(dateStr.substr(i*2,2),16);
        }
        return resultDate;
    }

    //截取多包里面的数据
    function read_msg_data(msg) {
        var msg_data = "";
        var msg_packes = (msg.length / 16) + 1;

		msg_data += msg.substr(8,8);
        for (var i = 1; i < msg_packes; i++) {
            msg_data += msg.substr((2+i*16),14);
        }
        return msg_data;
    }
